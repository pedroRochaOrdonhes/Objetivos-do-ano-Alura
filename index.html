<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Objetivos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card-hover: #222632;
      --border: #2a2f3d;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #00e676;
      --accent-dim: rgba(0, 230, 118, 0.15);
      --radius: 16px;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 230, 118, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 150, 255, 0.05), transparent);
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #14171f;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 1;
      min-width: 180px;
      padding: 18px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: color 0.25s ease, background 0.25s ease;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab.active {
      color: var(--text);
      background: var(--card);
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 12px;
      right: 12px;
      height: 3px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
      box-shadow: 0 0 12px var(--accent);
    }

    /* Content */
    .content {
      padding: 48px 40px 56px;
      text-align: center;
    }

    .goal-title {
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      line-height: 1.3;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.5s ease forwards;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.1s forwards;
    }

    /* Timer */
    .timer {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.2s forwards;
    }

    .time-block {
      background: var(--accent-dim);
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 14px;
      padding: 18px 12px 14px;
      min-width: 92px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .time-block:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 230, 118, 0.4);
    }

    .time-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 700;
      line-height: 1;
      color: #fff;
      letter-spacing: -0.03em;
    }

    .time-unit {
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      margin-top: 8px;
      text-transform: lowercase;
      letter-spacing: 0.04em;
    }

    /* Footer hint */
    .hint {
      margin-top: 36px;
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeUp 0.5s ease 0.35s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 540px) {
      .content {
        padding: 36px 20px 44px;
      }

      .time-block {
        min-width: 72px;
        padding: 14px 8px 12px;
      }

      .tab {
        padding: 16px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="0" role="tab">Cursos na Alura</button>
      <button class="tab" data-tab="1" role="tab">Criar projetos em Javascript</button>
      <button class="tab" data-tab="2" role="tab">Criar um portfolio</button>
      <button class="tab" data-tab="3" role="tab">Atualizar meu currículo</button>
    </div>

    <div class="content">
      <h1 class="goal-title" id="goal-title">Estudar 4 cursos na Alura</h1>
      <p class="label">Tempo para completar o objetivo</p>

      <div class="timer" id="timer">
        <div class="time-block">
          <div class="time-value" id="days">00</div>
          <div class="time-unit">dias</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="hours">00</div>
          <div class="time-unit">horas</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="mins">00</div>
          <div class="time-unit">min</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="secs">00</div>
          <div class="time-unit">seg</div>
        </div>
      </div>

      <p class="hint" id="hint">Foco total · 1 curso por semana</p>
    </div>
  </div>

  <script>
    // Dados de cada objetivo (você pode alterar as datas)
    const goals = [
      {
        title: "Estudar 4 cursos na Alura",
        target: new Date("2026-12-12T23:59:59"),
        hint: "Foco total · 1 curso por semana"
      },
      {
        title: "Criar 3 projetos em JavaScript",
        target: new Date("2026-11-28T23:59:59"),
        hint: "Projetos reais para o portfólio"
      },
      {
        title: "Criar um portfólio profissional",
        target: new Date("2026-12-05T23:59:59"),
        hint: "Design limpo + projetos destacados"
      },
      {
        title: "Atualizar meu currículo",
        target: new Date("2026-11-20T23:59:59"),
        hint: "Versão atualizada e pronta para enviar"
      }
    ];

    let currentTab = 0;
    let timerInterval = null;

    // Elementos
    const titleEl = document.getElementById("goal-title");
    const hintEl = document.getElementById("hint");
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minsEl = document.getElementById("mins");
    const secsEl = document.getElementById("secs");
    const tabs = document.querySelectorAll(".tab");

    function updateTimer(target) {
      const now = new Date();
      const diff = target - now;

      if (diff <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minsEl.textContent = "00";
        secsEl.textContent = "00";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      daysEl.textContent = String(days).padStart(2, "0");
      hoursEl.textContent = String(hours).padStart(2, "0");
      minsEl.textContent = String(mins).padStart(2, "0");
      secsEl.textContent = String(secs).padStart(2, "0");
    }

    function switchTab(index) {
      currentTab = index;

      // Atualiza tabs
      tabs.forEach((tab, i) => {
        tab.classList.toggle("active", i === index);
      });

      // Atualiza conteúdo com animação
      const goal = goals[index];
      titleEl.style.opacity = "0";
      titleEl.style.transform = "translateY(8px)";
      hintEl.style.opacity = "0";

      setTimeout(() => {
        titleEl.textContent = goal.title;
        hintEl.textContent = goal.hint;
        titleEl.style.opacity = "1";
        titleEl.style.transform = "translateY(0)";
        hintEl.style.opacity = "1";
      }, 150);

      // Reinicia o timer
      clearInterval(timerInterval);
      updateTimer(goal.target);
      timerInterval = setInterval(() => updateTimer(goal.target), 1000);
    }

    // Eventos das tabs
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const index = Number(tab.dataset.tab);
        if (index !== currentTab) switchTab(index);
      });
    });

    // Inicia
    switchTab(0);
  </script>
</body>
</html>
