<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>objetivos do ano</title>
    <link rel="stylesheet" href="source/style.css">
</head>
<body>
    <header>
        <b>Meus objetivos do ano</b>
    </header>
    
    
    <main>
        <div class="topics"></div>
        
        <div class="principal">
            <div class="title"></div>
            <p>Tempo para completar o objetivo</p>
            <div class="time">
                <div class="days">
                    <div class="d"></div>
                    <div class="dtext">DIAS</div>
                </div>
                <div class="hours">
                    <div class="h"></div>
                    <div class="htext">HORAS</div>
                </div>
                <div class="minutes">
                    <div class="m"></div>
                    <div class="mtext">MINUTOS</div>
                </div>
                <div class="seconds">
                    <div class="s"></div>
                    <div class="stext">SEGUNDOS</div>
                </div>
            </div>
        </div>
    </main>


    <footer>
        Copyright todos direitos pertencem a Pedro Rocha Ordonhes
    </footer>

    <script src="source/script.js"></script>
</body>
</html>
